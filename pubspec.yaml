name: flowchart_thesis
description: "A new Flutter project for thesis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # == UI & THEME ==
  fluent_ui: ^4.8.7
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  go_router: ^14.2.0
  font_awesome_flutter: ^10.7.0
  popover: ^0.2.8+2
  file_picker:
  web_socket_channel:
  url_launcher:
  uuid:
  flutter_svg:

  # == FIREBASE ==
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_analytics: ^11.1.0
  firebase_ui_auth: ^1.14.0
  firebase_ui_oauth_google: ^1.3.1
  firebase_remote_config: ^5.0.1
  google_sign_in: ^6.2.1

  # == BLOC & STATE ==
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  universal_html: ^2.2.4
  image: ^4.2.0
  cached_network_image: ^3.3.1

  # == REPOSITORIES LOCALI ==
  user_repository:
    path: packages/user_repository
  file_repository:
    path: packages/file_repository
  project_repository:
    path: packages/project_repository
  flowchart_repository:
    path: packages/flowchart_repository
  debug_repository:
    path: packages/debug_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  math_expressions: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
